<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Algoritma Telur Dadar 🍳</title>
  <style>
    :root {
      --primary-color: #ffb703;
      --secondary-color: #fb8500;
      --bg-color: #fefae0;
      --card-bg: #ffffff;
      --text-color: #023047;
    }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: var(--secondary-color);
      text-shadow: 2px 2px 0px #fff;
      margin-bottom: 5px;
      text-align: center;
    }

    p.subtitle {
      font-size: 1rem;
      margin-top: 0;
      text-align: center;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      border: 4px solid var(--primary-color);
      box-sizing: border-box;
    }

    .dropzone {
      min-height: 140px;
      background-color: #e2e8f0;
      border: 3px dashed #94a3b8;
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .dropzone.drag-over {
      background-color: #cbd5e1;
      border-color: var(--secondary-color);
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      min-height: 50px;
    }

    .step-item {
      background-color: var(--primary-color);
      color: #000;
      font-weight: bold;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: grab;
      user-select: none;
      box-shadow: 0 4px 0px var(--secondary-color);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .step-item:active {
      cursor: grabbing;
    }

    .step-item.dragging {
      opacity: 0.4;
      transform: scale(0.98);
    }

    .step-item .handle {
      font-size: 1.2rem;
      color: #713f12;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
    }

    .btn-run {
      background-color: #2a9d8f;
      box-shadow: 0 4px 0px #264653;
    }

    .btn-reset {
      background-color: #e76f51;
      box-shadow: 0 4px 0px #9b2226;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      display: none;
    }

    .success {
      background-color: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }

    .placeholder-text {
      color: #64748b;
      text-align: center;
      margin: auto;
      pointer-events: none;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <h1>🍳 Petualangan Telur Dadar!</h1>
  <p class="subtitle">Geser & susun blok langkah di bawah ke dalam kotak algoritma!</p>

  <div class="container">
    <h3>Urutan Algoritma Mu:</h3>
    <div id="dropzone" class="dropzone" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
      <div id="placeholder" class="placeholder-text">Tarik dan lepaskan langkah-langkah ke sini!</div>
    </div>

    <h3>Pilihan Langkah:</h3>
    <div id="stepContainer" class="step-list" ondragover="handleDragOver(event)" ondrop="handleDropToPool(event)"></div>

    <div class="buttons">
      <button class="btn-run" onclick="checkAlgorithm()">▶️ Jalankan Algoritma</button>
      <button class="btn-reset" onclick="resetGame()">🔄 Acak Ulang</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    const masterSteps = [
      { id: 1, text: "🥚 Pecahkan telur ke dalam mangkuk", order: 1 },
      { id: 2, text: "🧂 Tambahkan sedikit garam & bumbu", order: 2 },
      { id: 3, text: "🥣 Kocok telur hingga tercampur rata", order: 3 },
      { id: 4, text: "🔥 Panaskan sedikit minyak di wajan", order: 4 },
      { id: 5, text: "🍳 Tuang adonan telur ke wajan panas", order: 5 },
      { id: 6, text: "🍽️ Angkat dan sajikan di atas piring", order: 6 }
    ];

    let draggedElement = null;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      const stepContainer = document.getElementById("stepContainer");
      const dropzone = document.getElementById("dropzone");
      
      stepContainer.innerHTML = "";
      dropzone.innerHTML = '<div id="placeholder" class="placeholder-text">Tarik dan lepaskan langkah-langkah ke sini!</div>';
      document.getElementById("result").style.display = "none";

      const shuffled = shuffle([...masterSteps]);

      shuffled.forEach(step => {
        const item = createStepElement(step);
        stepContainer.appendChild(item);
      });
    }

    function createStepElement(step) {
      const div = document.createElement("div");
      div.className = "step-item";
      div.draggable = true;
      div.dataset.id = step.id;
      div.dataset.order = step.order;
      div.innerHTML = `<span class="handle">☰</span> <span>${step.text}</span>`;

      div.addEventListener("dragstart", (e) => {
        draggedElement = div;
        div.classList.add("dragging");
        e.dataTransfer.setData("text/plain", step.id);
      });

      div.addEventListener("dragend", () => {
        div.classList.remove("dragging");
        draggedElement = null;
        updatePlaceholder();
      });

      return div;
    }

    function handleDragOver(e) {
      e.preventDefault();
      const container = e.currentTarget;
      container.classList.add("drag-over");

      const afterElement = getDragAfterElement(container, e.clientY);
      if (draggedElement) {
        if (afterElement == null) {
          container.appendChild(draggedElement);
        } else {
          container.insertBefore(draggedElement, afterElement);
        }
      }
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove("drag-over");
    }

    function handleDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.remove("drag-over");
      updatePlaceholder();
    }

    function handleDropToPool(e) {
      e.preventDefault();
      const stepContainer = document.getElementById("stepContainer");
      if (draggedElement) {
        stepContainer.appendChild(draggedElement);
      }
      updatePlaceholder();
    }

    // Menentukan posisi berdasarkan pergerakan kursor (untuk re-ordering halus)
    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.step-item:not(.dragging)')];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function updatePlaceholder() {
      const dropzone = document.getElementById("dropzone");
      const placeholder = document.getElementById("placeholder");
      const items = dropzone.querySelectorAll(".step-item");

      if (items.length > 0 && placeholder) {
        placeholder.style.display = "none";
      } else if (items.length === 0 && placeholder) {
        placeholder.style.display = "block";
      }
    }

    function checkAlgorithm() {
      const dropzone = document.getElementById("dropzone");
      const resultDiv = document.getElementById("result");
      const currentItems = [...dropzone.querySelectorAll(".step-item")];

      resultDiv.style.display = "block";

      if (currentItems.length < masterSteps.length) {
        resultDiv.className = "error";
        resultDiv.innerHTML = "⚠️ Algoritma belum lengkap! Masukkan semua 6 langkah ke kotak atas.";
        return;
      }

      let isCorrect = true;
      currentItems.forEach((item, index) => {
        const correctOrder = parseInt(item.dataset.order);
        if (correctOrder !== index + 1) {
          isCorrect = false;
        }
      });

      if (isCorrect) {
        resultDiv.className = "success";
        resultDiv.innerHTML = "🎉 Hore! Algoritma sempurna! Telur dadar siap disantap. Kamu hebat! 😋";
      } else {
        resultDiv.className = "error";
        resultDiv.innerHTML = "❌ Waduh, ada bug dalam algoritma! Urutannya ada yang tertukar. Geser dan perbaiki urutannya!";
      }
    }

    function resetGame() {
      initGame();
    }

    initGame();
  </script>
</body>
</html>
